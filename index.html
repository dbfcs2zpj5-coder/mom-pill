<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>食藥未 — 媽咪服藥打卡</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="食藥未">
    <meta name="theme-color" content="#f3e2c5" id="theme-color-meta">

    <!-- PWA Manifest 與桌面 Icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: {
                            50: '#fffdf9',
                            100: '#fbf3e4',
                            200: '#f3e2c5',
                            300: '#e6cca0',
                            400: '#d4b078',
                            500: '#b88b4a',
                            600: '#966b2e',
                            700: '#78521f',
                            800: '#5c3d14',
                            900: '#3b260a',
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: #f3e2c5;
            color: #3b260a;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .zoom-in { animation: zoomIn 0.25s ease-out forwards; }
        @keyframes zoomIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 拖曳排序視覺效果 */
        .dragging-card {
            opacity: 0.92;
            transform: scale(1.02);
            box-shadow: 0 20px 30px -10px rgba(92, 61, 20, 0.35);
            border-color: #b88b4a !important;
            background-color: #fbf3e4 !important;
            z-index: 30;
        }
        .drag-over-target {
            border-top: 4px dashed #966b2e !important;
        }
        .drag-handle {
            touch-action: none;
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-[#f3e2c5] text-[#3b260a] fixed inset-0 flex flex-col select-none">

    <!-- 主內容區 -->
    <div class="flex-1 flex flex-col overflow-hidden relative w-full max-w-3xl mx-auto pt-safe min-h-0">
        
        <!-- ================= 1. 今日打卡視圖 ================= -->
        <div id="view-today" class="flex-1 flex flex-col p-4 relative h-full min-h-0">
            <div class="mb-4 mt-1 flex justify-between items-end shrink-0">
                <div>
                    <p class="text-xl text-[#78521f] font-extrabold mb-0.5" id="today-date-text">載入中...</p>
                    <h2 class="text-4xl font-black text-[#5c3d14] mt-0.5">今日打卡</h2>
                </div>
                <div class="bg-[#fffdf9] border-2 border-[#e6cca0] text-[#5c3d14] px-5 py-2.5 rounded-full text-xl font-black shadow-sm transition-colors" id="progress-text">
                    完成 0/0
                </div>
            </div>
            
            <div id="todayList" class="flex-1 overflow-y-auto pb-36 no-scrollbar px-0.5 overscroll-contain min-h-0">
                <!-- 動態生成的藥物卡片與備註欄將放在這裡 -->
            </div>
        </div>

        <!-- ================= 2. 歷史月曆視圖 ================= -->
        <div id="view-history" class="hidden flex-1 flex flex-col p-4 relative h-full min-h-0">
            <div class="mb-4 mt-1 flex justify-between items-center shrink-0 gap-2">
                <h2 class="text-4xl font-black text-[#5c3d14]">月曆紀錄</h2>
                <div class="flex items-center gap-2">
                    <button onclick="openAllNotesModal()" class="h-12 px-4 rounded-full bg-[#fffdf9] shadow-sm border-2 border-[#e6cca0] flex items-center justify-center text-[#78521f] active:scale-95 transition-transform font-black text-base">
                        <i class="fa-solid fa-file-lines mr-2"></i>所有備註
                    </button>
                    <!-- 月曆翻頁按鈕 -->
                    <button id="cal-prev-btn" onclick="changeCalendarMonth(-1)" aria-label="上一個月" class="w-12 h-12 rounded-full bg-[#fffdf9] shadow-sm border-2 border-[#e6cca0] flex items-center justify-center text-[#5c3d14] active:scale-95 transition-transform text-xl"><i class="fa-solid fa-chevron-left"></i></button>
                    <button id="cal-next-btn" onclick="changeCalendarMonth(1)" aria-label="下一個月" class="w-12 h-12 rounded-full bg-[#fffdf9] shadow-sm border-2 border-[#e6cca0] flex items-center justify-center text-[#5c3d14] active:scale-95 transition-transform text-xl hidden"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            <p class="text-2xl text-[#78521f] font-black mb-3 shrink-0" id="calendar-month-year">載入中...</p>
            
            <!-- 顏色圖例說明 -->
            <div class="flex flex-wrap gap-4 mb-4 shrink-0 bg-[#fffdf9] p-3.5 rounded-3xl shadow-sm border-2 border-[#e6cca0]">
                <div class="flex items-center gap-2"><div class="w-5 h-5 rounded-full bg-green-500"></div><span class="text-base font-black text-[#3b260a]">全部食齊</span></div>
                <div class="flex items-center gap-2"><div class="w-5 h-5 rounded-full bg-amber-500"></div><span class="text-base font-black text-[#3b260a]">部分漏食</span></div>
                <div class="flex items-center gap-2"><div class="w-5 h-5 rounded-full bg-[#e6cca0]"></div><span class="text-base font-black text-[#3b260a]">無紀錄</span></div>
            </div>

            <!-- 月曆網格與提示 -->
            <div class="bg-[#fffdf9] rounded-[2rem] p-5 shadow-sm border-2 border-[#e6cca0] flex-1 flex flex-col min-h-0 overflow-y-auto no-scrollbar pb-28">
                <div class="grid grid-cols-7 gap-2 md:gap-3 flex-shrink-0" id="calendar-grid">
                    <!-- 月曆內容將由 JS 生成 -->
                </div>
                <div class="mt-6 text-center space-y-2 shrink-0">
                    <p class="text-base text-[#78521f] font-bold">💡 撳過去或今日嘅日子，可以查看或補回各時段打卡與備註</p>
                    <p class="text-sm text-[#966b2e] font-bold"><i class="fa-solid fa-comment-dots text-amber-600 mr-1"></i>有此標記代表當日寫咗備註</p>
                    <p class="text-sm text-[#966b2e] font-bold mt-2">💡 系統會自動保留最近 60 日紀錄，保持運作順暢</p>
                </div>
            </div>
        </div>

        <!-- ================= 3. 藥物管理視圖 ================= -->
        <div id="view-manage" class="hidden flex-1 flex flex-col p-4 relative h-full min-h-0">
            <div class="mb-4 mt-1 flex justify-between items-center shrink-0 gap-2">
                <h2 class="text-4xl font-black text-[#5c3d14]">藥物清單</h2>
                <div class="flex items-center gap-2.5">
                    <!-- 防誤觸管理鎖按鈕 -->
                    <button id="manage-lock-btn" onclick="toggleManageLock()" class="h-14 px-4 rounded-2xl border-2 font-black text-lg flex items-center gap-2 shadow-sm active:scale-95 transition-all">
                        <!-- 由 JS 渲染鎖定或解鎖狀態 -->
                    </button>
                    <button id="add-med-top-btn" onclick="handleAddMedClick()" aria-label="新增藥物" class="bg-[#966b2e] text-white w-14 h-14 rounded-2xl shadow-md flex items-center justify-center text-2xl active:bg-[#78521f] transition-all active:scale-95">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- 管理鎖狀態橫幅提示 -->
            <div id="manage-lock-banner" class="mb-3 px-4 py-3 rounded-2xl border-2 text-base font-bold flex items-center justify-between shrink-0 transition-colors">
                <!-- 由 JS 更新 -->
            </div>
            
            <!-- 匯出與匯入功能 -->
            <div class="flex gap-3 mb-2 shrink-0">
                <button onclick="exportData()" class="flex-1 bg-[#fffdf9] border-2 border-[#e6cca0] text-[#5c3d14] py-3 rounded-2xl font-black shadow-sm active:scale-95 transition flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-file-export text-[#966b2e]"></i> 匯出備份
                </button>
                <button id="import-data-btn" onclick="handleImportClick()" class="flex-1 bg-[#fffdf9] border-2 border-[#e6cca0] text-[#5c3d14] py-3 rounded-2xl font-black shadow-sm active:scale-95 transition flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-file-import text-green-700"></i> 匯入資料
                </button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </div>
            
            <!-- 系統狀態提示列 -->
            <div id="app-status-bar" class="hidden mb-2 py-1 text-[#966b2e] text-center font-bold text-xs transition-colors cursor-default shrink-0">正在檢查系統狀態...</div>
            
            <div id="manageList" class="flex-1 overflow-y-auto space-y-4 pb-36 no-scrollbar px-0.5 overscroll-contain min-h-0">
                <!-- 藥物卡片將由 JS 生成 -->
            </div>
        </div>

    </div>

    <!-- ================= 底部導航 (絕對定位，層級 z-20) ================= -->
    <div class="bg-[#fffdf9] border-t-2 border-[#e6cca0] flex justify-around p-2.5 pb-safe shadow-[0_-8px_25px_-12px_rgba(92,61,20,0.18)] z-20 w-full absolute bottom-0 left-0 rounded-t-3xl">
        <button onclick="switchTab('today')" id="tab-today" class="flex flex-col items-center justify-center text-[#966b2e] font-black transition-transform active:scale-95 w-1/3 gap-1 py-1.5">
            <i class="fa-solid fa-calendar-check text-2xl md:text-3xl"></i>
            <span class="text-base md:text-lg font-black">今日打卡</span>
        </button>
        <button onclick="switchTab('history')" id="tab-history" class="flex flex-col items-center justify-center text-[#b88b4a]/70 font-black transition-transform active:scale-95 w-1/3 border-l-2 border-[#f3e2c5] gap-1 py-1.5">
            <i class="fa-solid fa-calendar-days text-2xl md:text-3xl"></i>
            <span class="text-base md:text-lg font-black">月曆紀錄</span>
        </button>
        <button onclick="switchTab('manage')" id="tab-manage" class="flex flex-col items-center justify-center text-[#b88b4a]/70 font-black transition-transform active:scale-95 w-1/3 border-l-2 border-[#f3e2c5] gap-1 py-1.5">
            <i class="fa-solid fa-capsules text-2xl md:text-3xl"></i>
            <span class="text-base md:text-lg font-black">藥物管理</span>
        </button>
    </div>

    <!-- ================= 彈出視窗：所有備註 (照顧者功能 z-[55]) ================= -->
    <div id="modal-all-notes" class="fixed inset-0 bg-[#3b260a]/70 z-[55] hidden flex-col justify-end backdrop-blur-sm">
        <div class="bg-[#fffdf9] border-t-4 border-[#e6cca0] w-full max-w-3xl mx-auto rounded-t-[2.5rem] p-6 pb-safe max-h-[85vh] flex flex-col zoom-in shadow-2xl relative">
            <div class="w-16 h-2 bg-[#e6cca0] rounded-full mx-auto mb-5 shrink-0"></div>
            <div class="flex justify-between items-center mb-5 shrink-0">
                <h3 class="text-3xl font-black text-[#5c3d14]">📝 所有備註紀錄</h3>
                <button onclick="closeAllNotesModal()" aria-label="關閉所有備註" class="w-14 h-14 bg-[#f3e2c5] text-[#5c3d14] rounded-full flex items-center justify-center text-2xl active:scale-95 transition-transform"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="all-notes-content" class="flex-1 overflow-y-auto min-h-0 no-scrollbar pb-10 space-y-4 overscroll-contain">
                <!-- 備註列表由 JS 生成 -->
            </div>
        </div>
    </div>

    <!-- ================= 彈出視窗：新增/編輯藥物 (層級 z-40) ================= -->
    <div id="modal-add" class="fixed inset-0 bg-[#3b260a]/70 z-40 hidden flex-col justify-end backdrop-blur-sm">
        <div id="modal-add-scroll" class="bg-[#fffdf9] border-t-4 border-[#e6cca0] w-full max-w-3xl mx-auto rounded-t-[2.5rem] p-6 pb-safe max-h-[92dvh] overflow-y-auto overscroll-contain zoom-in shadow-2xl relative min-h-0">
            <div class="w-16 h-2 bg-[#e6cca0] rounded-full mx-auto mb-5 shrink-0"></div>
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-3xl font-black text-[#5c3d14]" id="modal-title">新增藥物</h3>
                <button onclick="closeAddModal()" aria-label="關閉" class="w-12 h-12 bg-[#f3e2c5] text-[#5c3d14] rounded-full flex items-center justify-center text-2xl active:scale-95"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <input type="hidden" id="medId">
            
            <div class="space-y-6 pb-8">
                <!-- 圖片上傳區 (加大預覽尺寸，最多 8 張) -->
                <div>
                    <label class="block text-xl font-black text-[#5c3d14] mb-2">藥物相片 <span class="text-base font-bold text-[#966b2e]">(最多 8 張，可拍藥袋及藥丸樣貌)</span></label>
                    <div class="flex gap-4 overflow-x-auto py-2 no-scrollbar" id="imagePreviewContainer">
                        <!-- 動態圖片與上傳按鈕 -->
                    </div>
                </div>

                <!-- 藥物名稱 -->
                <div>
                    <label for="medName" class="block text-xl font-black text-[#5c3d14] mb-2">藥物名稱 <span class="text-red-600">*</span></label>
                    <input type="text" id="medName" placeholder="例如：降血壓藥（白色圓形）" class="w-full bg-[#fbf3e4] border-2 border-[#e6cca0] text-[#3b260a] rounded-2xl px-5 py-4 focus:outline-none focus:border-[#966b2e] font-black text-2xl transition-colors placeholder-[#b88b4a]/70">
                </div>

                <!-- 多時段選擇（早／午／晚／睡前，可多選） -->
                <div>
                    <label class="block text-xl font-black text-[#5c3d14] mb-2">每日服藥時段 <span class="text-red-600">*</span> <span class="text-base font-bold text-[#966b2e]">(可揀多個時段，會喺同一張卡內打卡)</span></label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="slotSelectorContainer">
                        <button type="button" data-slot="morning" onclick="toggleFormSlot('morning')" class="slot-select-btn py-4 px-3 rounded-2xl border-2 font-black text-xl flex flex-col items-center justify-center gap-1 transition-all active:scale-95">
                            <span class="text-2xl">☀️</span>
                            <span>早</span>
                        </button>
                        <button type="button" data-slot="noon" onclick="toggleFormSlot('noon')" class="slot-select-btn py-4 px-3 rounded-2xl border-2 font-black text-xl flex flex-col items-center justify-center gap-1 transition-all active:scale-95">
                            <span class="text-2xl">🌤️</span>
                            <span>午</span>
                        </button>
                        <button type="button" data-slot="evening" onclick="toggleFormSlot('evening')" class="slot-select-btn py-4 px-3 rounded-2xl border-2 font-black text-xl flex flex-col items-center justify-center gap-1 transition-all active:scale-95">
                            <span class="text-2xl">🌙</span>
                            <span>晚</span>
                        </button>
                        <button type="button" data-slot="bedtime" onclick="toggleFormSlot('bedtime')" class="slot-select-btn py-4 px-3 rounded-2xl border-2 font-black text-xl flex flex-col items-center justify-center gap-1 transition-all active:scale-95">
                            <span class="text-2xl">🛌</span>
                            <span>睡前</span>
                        </button>
                    </div>
                </div>
                
                <!-- 服藥指示 -->
                <div>
                    <label for="medDosage" class="block text-xl font-black text-[#5c3d14] mb-2">服藥指示 (每次份量及飯前/飯後)</label>
                    <input type="text" id="medDosage" placeholder="例如：每次食 1 粒（飯後服）" class="w-full bg-[#fbf3e4] border-2 border-[#e6cca0] text-[#3b260a] rounded-2xl px-5 py-4 focus:outline-none focus:border-[#966b2e] font-bold text-xl md:text-2xl transition-colors placeholder-[#b88b4a]/70">
                </div>

                <!-- 主要用途 -->
                <div>
                    <label for="medPurpose" class="block text-xl font-black text-[#5c3d14] mb-2">主要用途</label>
                    <input type="text" id="medPurpose" placeholder="例如：控制血壓、保護胃部" class="w-full bg-[#fbf3e4] border-2 border-[#e6cca0] text-[#3b260a] rounded-2xl px-5 py-4 focus:outline-none focus:border-[#966b2e] font-bold text-xl md:text-2xl transition-colors placeholder-[#b88b4a]/70">
                </div>
                
                <!-- 注意事項與副作用 -->
                <div>
                    <label for="medSideEffects" class="block text-xl font-black text-[#5c3d14] mb-2">注意事項與副作用</label>
                    <textarea id="medSideEffects" placeholder="例如：食完可能會少少頭暈，唔好同西柚一齊食" rows="3" class="w-full bg-[#fbf3e4] border-2 border-[#e6cca0] text-[#3b260a] rounded-2xl px-5 py-4 focus:outline-none focus:border-[#966b2e] font-bold text-xl transition-colors placeholder-[#b88b4a]/70"></textarea>
                </div>
            </div>

            <div class="flex gap-4 mt-2 mb-4 pt-safe shrink-0">
                <button onclick="closeAddModal()" class="flex-1 bg-[#f3e2c5] text-[#5c3d14] py-4 rounded-2xl font-black text-2xl active:bg-[#e6cca0] transition">取消</button>
                <button onclick="saveMedication()" class="flex-[2] bg-[#966b2e] text-white py-4 rounded-2xl font-black text-2xl shadow-lg active:bg-[#78521f] transition">儲存藥物</button>
            </div>
        </div>
    </div>

    <!-- ================= 彈出視窗：注意事項詳情 (長者友善收納區 z-[65]) ================= -->
    <div id="modal-med-info" class="fixed inset-0 bg-[#3b260a]/70 z-[65] hidden flex-col justify-end backdrop-blur-sm">
        <div class="bg-[#fffdf9] border-t-4 border-[#e6cca0] w-full max-w-3xl mx-auto rounded-t-[2.5rem] p-6 pb-safe max-h-[75vh] flex flex-col zoom-in shadow-2xl relative">
            <div class="w-16 h-2 bg-[#e6cca0] rounded-full mx-auto mb-5 shrink-0"></div>
            <div class="flex justify-between items-center mb-5 shrink-0">
                <h3 class="text-3xl font-black text-[#5c3d14]"><i class="fa-solid fa-circle-info text-[#966b2e] mr-2"></i>注意事項</h3>
                <button onclick="closeMedInfo()" aria-label="關閉注意事項" class="w-14 h-14 bg-[#f3e2c5] text-[#5c3d14] rounded-full flex items-center justify-center text-2xl active:scale-95 transition-transform"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto min-h-0 no-scrollbar pb-6 overscroll-contain">
                <p id="info-med-name" class="text-2xl font-black text-[#78521f] mb-4"></p>
                <div class="bg-[#fbf3e4] border-2 border-[#e6cca0] p-5 rounded-3xl">
                    <p id="info-med-desc" class="text-2xl font-bold text-[#3b260a] leading-relaxed whitespace-pre-wrap"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 彈出視窗：歷史紀錄詳情 (層級 z-[60]) ================= -->
    <div id="modal-history-detail" class="fixed inset-0 bg-[#3b260a]/70 z-[60] hidden flex-col justify-end backdrop-blur-sm">
        <div class="bg-[#fffdf9] border-t-4 border-[#e6cca0] w-full max-w-3xl mx-auto rounded-t-[2.5rem] p-6 pb-safe max-h-[88vh] flex flex-col zoom-in shadow-2xl relative">
            <div class="w-16 h-2 bg-[#e6cca0] rounded-full mx-auto mb-5 shrink-0"></div>
            <div class="flex justify-between items-center mb-5 shrink-0">
                <h3 class="text-3xl font-black text-[#5c3d14]" id="history-detail-title">紀錄詳情</h3>
                <button onclick="closeHistoryDetail()" aria-label="關閉紀錄詳情" class="w-14 h-14 bg-[#f3e2c5] text-[#5c3d14] rounded-full flex items-center justify-center text-2xl active:scale-95 transition-transform"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto min-h-0 no-scrollbar pb-10 space-y-3 overscroll-contain">
                <!-- 備註輸入框 -->
                <div class="mb-5 bg-[#fbf3e4] p-4 rounded-3xl border-2 border-[#e6cca0]">
                    <label for="history-note-input" class="block text-xl font-black text-[#5c3d14] mb-2"><i class="fa-solid fa-pen mr-2"></i>當日備註</label>
                    <textarea id="history-note-input" placeholder="例如：今日去覆診、血壓正常" rows="2" class="w-full bg-[#fffdf9] border-2 border-[#e6cca0] text-[#3b260a] rounded-2xl px-4 py-3 focus:outline-none focus:border-[#966b2e] font-bold text-xl transition-colors placeholder-[#b88b4a]/70"></textarea>
                </div>
                <div id="history-detail-content" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <!-- ================= 彈出視窗：智慧型確認 (層級 z-[70] 最高防穿透) ================= -->
    <div id="modal-confirm" class="fixed inset-0 bg-[#3b260a]/80 z-[70] hidden flex items-center justify-center p-5 backdrop-blur-sm">
        <div class="bg-[#fffdf9] rounded-[2.5rem] p-7 w-full max-w-sm shadow-2xl zoom-in text-center border-4 border-[#e6cca0]">
            <!-- 動態 Icon 容器 -->
            <div id="confirm-icon-container" class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-5 text-5xl"></div>
            <h3 class="text-3xl font-black text-[#3b260a] mb-3" id="confirm-title">確認視窗</h3>
            <p class="text-[#78521f] mb-7 font-bold text-xl leading-relaxed" id="confirm-message">確定要執行此操作？</p>
            <div class="flex flex-col gap-3.5">
                <button id="confirm-action-btn" class="w-full text-white py-4 rounded-2xl font-black text-2xl shadow-lg active:opacity-80 transition">確定</button>
                <button id="confirm-cancel-btn" onclick="closeConfirmModal()" class="w-full bg-[#f3e2c5] text-[#5c3d14] py-4 rounded-2xl font-black text-2xl active:bg-[#e6cca0] transition">返回保留</button>
            </div>
        </div>

    <!-- ================= 圖片畫廊檢視器 (層級 z-[80]，支援點擊放大檢視) ================= -->
    <div id="modal-image-viewer" class="fixed inset-0 bg-[#261705]/95 z-[80] hidden flex-col backdrop-blur-md">
        <div class="flex justify-between items-center px-6 py-4 pt-safe shrink-0 border-b border-[#5c3d14]">
            <p class="text-[#f3e2c5] font-bold text-lg"><i class="fa-solid fa-magnifying-glass-plus mr-1.5"></i>撳一下相片可放大／縮小睇清楚</p>
            <button onclick="closeImageViewer()" aria-label="關閉圖片檢視器" class="w-14 h-14 bg-[#5c3d14] border-2 border-[#b88b4a] rounded-full text-[#fffdf9] flex items-center justify-center text-3xl shadow-2xl active:scale-95 transition-transform z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="viewer-img-container" class="flex-1 overflow-y-auto min-h-0 flex flex-col items-center justify-start gap-8 p-4 pb-32 no-scrollbar overscroll-contain">
        </div>
    </div>

    <!-- ================= Toast 提示 (層級 z-[90]) ================= -->
    <div id="toast" class="fixed top-14 left-1/2 transform -translate-x-1/2 -translate-y-4 bg-[#3b260a] text-[#fffdf9] px-6 py-4 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-[90] font-black text-xl flex items-center gap-3 w-max max-w-[92%] border-2 border-[#b88b4a]">
        <span id="toast-icon" class="text-3xl"></span>
        <span id="toast-message"></span>
    </div>

    <script>
        // ====== 時段定義（早／午／晚／睡前） ======
        const SLOT_DEFINITIONS = [
            { key: 'morning', label: '早', icon: '☀️', startHour: 4, endHour: 11 },
            { key: 'noon',    label: '午', icon: '🌤️', startHour: 11, endHour: 16 },
            { key: 'evening', label: '晚', icon: '🌙', startHour: 16, endHour: 21 },
            { key: 'bedtime', label: '睡前', icon: '🛌', startHour: 21, endHour: 28 }
        ];
        const VALID_SLOT_KEYS = SLOT_DEFINITIONS.map(s => s.key);

        // ====== 全局變數 ======
        let medications = []; 
        let dailyLogs = {}; 
        let dailyNotes = {}; 
        let currentEditingImages = []; 
        let currentEditingSlots = ['morning'];
        let confirmActionCallback = null; 
        let toastTimeout = null;
        let noteSaveTimer = null;
        let activeNoteEdit = null; // 追蹤未寫入的備註 { dateStr, value }
        let isManageUnlocked = false; // 防誤觸管理鎖（預設上鎖）
        let lastToggleTimestamp = 0;  // 防止長者手震連撳兩下

        // 拖曳排序狀態
        let dragState = {
            draggingId: null,
            startY: 0,
            currentIndex: -1
        };
        
        // 全局月曆顯示月份 (預設為本月)
        let displayCalYear = new Date().getFullYear();
        let displayCalMonth = new Date().getMonth();

        // ====== 安全與輔助功能 ======
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getTodayString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function getDisplayDate() {
            const d = new Date();
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（星期${days[d.getDay()]}）`;
        }

        // 取得藥物有效的時段陣列（按 早->午->晚->睡前 順序排列）
        function getMedSlots(med) {
            if (med && Array.isArray(med.slots) && med.slots.length > 0) {
                const filtered = VALID_SLOT_KEYS.filter(k => med.slots.includes(k));
                if (filtered.length > 0) return filtered;
            }
            // 相容舊版單一 time 欄位自動轉換
            if (med && typeof med.time === 'string' && med.time.includes(':')) {
                const hour = parseInt(med.time.split(':')[0], 10);
                if (!isNaN(hour)) {
                    if (hour >= 4 && hour < 11) return ['morning'];
                    if (hour >= 11 && hour < 16) return ['noon'];
                    if (hour >= 16 && hour < 21) return ['evening'];
                    return ['bedtime'];
                }
            }
            return ['morning'];
        }

        // 檢查某日某藥物的某時段是否已打卡（完全兼容舊版 boolean 紀錄）
        function isSlotChecked(dateStr, med, slotKey) {
            const dayLog = dailyLogs[dateStr];
            if (!dayLog || !med) return false;
            const entry = dayLog[med.id];
            if (entry === true) return true; // 舊版 boolean 代表全部時段已食
            if (entry && typeof entry === 'object') {
                return entry[slotKey] === true;
            }
            return false;
        }

        // 計算某日總應服時段數與已完成時段數
        function getDayProgressStats(dateStr) {
            const dayLog = dailyLogs[dateStr] || {};
            let totalSlots = 0;
            let takenSlots = 0;

            medications.forEach(med => {
                const slots = getMedSlots(med);
                totalSlots += slots.length;
                slots.forEach(slotKey => {
                    if (isSlotChecked(dateStr, med, slotKey)) {
                        takenSlots++;
                    }
                });
            });

            // 如果是過去的日子，而且當日有儲存過歷史快照（避免日後加新藥令過去已完成的綠燈變橙燈）
            if (dateStr !== getTodayString() && dayLog._meta && typeof dayLog._meta.completedAll === 'boolean') {
                // 若當日目前已沒有任何打卡，則視為 0
                const anyTakenNow = Object.keys(dayLog).some(k => k !== '_meta' && (dayLog[k] === true || (typeof dayLog[k] === 'object' && Object.values(dayLog[k]).some(Boolean))));
                if (!anyTakenNow) {
                    return { takenSlots: 0, totalSlots };
                }
                if (dayLog._meta.completedAll && takenSlots > 0) {
                    return { takenSlots: Math.max(takenSlots, totalSlots), totalSlots: Math.max(takenSlots, totalSlots) };
                }
            }

            return { takenSlots, totalSlots };
        }

        // 更新當日歷史快照狀態
        function updateDaySnapshotMeta(dateStr) {
            const dayLog = dailyLogs[dateStr];
            if (!dayLog) return;
            let totalSlots = 0;
            let takenSlots = 0;
            medications.forEach(med => {
                const slots = getMedSlots(med);
                totalSlots += slots.length;
                slots.forEach(slotKey => {
                    if (isSlotChecked(dateStr, med, slotKey)) takenSlots++;
                });
            });
            // 清除空藥物的鍵值
            for (const key of Object.keys(dayLog)) {
                if (key === '_meta') continue;
                const val = dayLog[key];
                if (!val || (typeof val === 'object' && !Object.values(val).some(Boolean))) {
                    delete dayLog[key];
                }
            }
            const remainingMedKeys = Object.keys(dayLog).filter(k => k !== '_meta');
            if (remainingMedKeys.length === 0) {
                delete dailyLogs[dateStr];
            } else {
                dayLog._meta = {
                    completedAll: (totalSlots > 0 && takenSlots === totalSlots),
                    updatedAt: Date.now()
                };
            }
        }

        // ====== 資料結構升級與淨化 (Migration & Sanitization) ======
        function normalizeAllData() {
            let changed = false;
            if (!Array.isArray(medications)) {
                medications = [];
                changed = true;
            }
            medications.forEach((med, idx) => {
                if (!med || typeof med !== 'object') return;
                if (!med.id) {
                    med.id = `med_${Date.now()}_${idx}`;
                    changed = true;
                }
                const normalizedSlots = getMedSlots(med);
                if (!Array.isArray(med.slots) || JSON.stringify(med.slots) !== JSON.stringify(normalizedSlots)) {
                    med.slots = normalizedSlots;
                    changed = true;
                }
                if (!Array.isArray(med.images)) {
                    med.images = [];
                    changed = true;
                }
            });

            // 升級舊版 boolean 打卡紀錄為多時段物件
            for (const dateStr of Object.keys(dailyLogs)) {
                const log = dailyLogs[dateStr];
                if (!log || typeof log !== 'object') {
                    delete dailyLogs[dateStr];
                    changed = true;
                    continue;
                }
                for (const medId of Object.keys(log)) {
                    if (medId === '_meta') continue;
                    if (log[medId] === true) {
                        const med = medications.find(m => m.id === medId);
                        const slots = med ? getMedSlots(med) : ['morning'];
                        const slotObj = {};
                        slots.forEach(s => { slotObj[s] = true; });
                        log[medId] = slotObj;
                        changed = true;
                    }
                }
            }
            return changed;
        }

        // ================= 初始化網絡狀態偵測與更新提示 =================
        function initNetworkStatus() {
            const statusBar = document.getElementById('app-status-bar');
            if (!statusBar) return;
            
            statusBar.classList.remove('hidden');
            let hasPendingUpdate = false;
            
            function updateStatus() {
                if (hasPendingUpdate && navigator.onLine) return;
                if (!navigator.onLine) {
                    statusBar.innerHTML = '✈️ 離線模式（資料已安全儲存在手機內）';
                    statusBar.className = 'mb-2 py-1 text-[#78521f] text-center font-bold text-xs transition-colors cursor-default shrink-0';
                    statusBar.onclick = null;
                } else {
                    statusBar.innerHTML = '系統運作正常・資料自動儲存於本機';
                    statusBar.className = 'mb-2 py-1 text-[#966b2e] text-center font-bold text-xs transition-colors cursor-default shrink-0';
                    statusBar.onclick = null;
                }
            }
            
            window.addEventListener('online', updateStatus);
            window.addEventListener('offline', updateStatus);
            updateStatus(); 

            if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        if (!installingWorker) return;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller && navigator.onLine) {
                                hasPendingUpdate = true;
                                statusBar.innerHTML = '🔄 發現新版本！撳呢度立即更新';
                                statusBar.className = 'mb-3 p-3 bg-[#fffdf9] text-[#78521f] rounded-2xl text-center font-black text-base cursor-pointer active:scale-95 shadow-sm transition-all border-2 border-[#966b2e] shrink-0';
                                statusBar.onclick = () => { window.location.reload(); };
                            }
                        };
                    };
                }).catch(err => console.log('SW註冊略過或失敗:', err));
            }
        }

        // ====== 啟動與核心載入 ======
        async function initApp() {
            try {
                const [storedMeds, storedLogs, storedNotes] = await Promise.all([
                    localforage.getItem('mom_medications'),
                    localforage.getItem('mom_dailyLogs'),
                    localforage.getItem('mom_dailyNotes')
                ]);
                
                if (Array.isArray(storedMeds)) medications = storedMeds;
                if (storedLogs && typeof storedLogs === 'object') dailyLogs = storedLogs;
                if (storedNotes && typeof storedNotes === 'object') dailyNotes = storedNotes;
            } catch (err) {
                console.warn('讀取本地儲存資料失敗:', err);
            }

            const migrated = normalizeAllData();
            if (migrated) await saveData();

            await purgeOldRecords();

            renderTodayView();
            renderHistoryView();
            renderManageView();
            initNetworkStatus();
        }

        // 自動清理超過 60 天的舊紀錄與無效空紀錄
        async function purgeOldRecords() {
            const todayDate = new Date();
            todayDate.setHours(0, 0, 0, 0);
            let hasChanges = false;
            
            const isExpiredDate = (dateStr) => {
                const parts = dateStr.split('-').map(Number);
                if (parts.length !== 3 || parts.some(isNaN)) return true;
                const logDate = new Date(parts[0], parts[1] - 1, parts[2]);
                logDate.setHours(0, 0, 0, 0);
                const diffDays = Math.floor((todayDate - logDate) / (1000 * 60 * 60 * 24));
                return diffDays > 60;
            };

            for (const dateStr of Object.keys(dailyLogs)) {
                if (isExpiredDate(dateStr) || !dailyLogs[dateStr] || typeof dailyLogs[dateStr] !== 'object') {
                    delete dailyLogs[dateStr];
                    hasChanges = true;
                    continue;
                }
                for (const medId of Object.keys(dailyLogs[dateStr])) {
                    if (medId === '_meta') continue;
                    const entry = dailyLogs[dateStr][medId];
                    if (!entry || (typeof entry === 'object' && !Object.values(entry).some(Boolean))) {
                        delete dailyLogs[dateStr][medId];
                        hasChanges = true;
                    }
                }
                const validKeys = Object.keys(dailyLogs[dateStr]).filter(k => k !== '_meta');
                if (validKeys.length === 0) {
                    delete dailyLogs[dateStr];
                    hasChanges = true;
                }
            }

            for (const dateStr of Object.keys(dailyNotes)) {
                if (isExpiredDate(dateStr) || typeof dailyNotes[dateStr] !== 'string' || !dailyNotes[dateStr].trim()) {
                    delete dailyNotes[dateStr];
                    hasChanges = true;
                }
            }

            if (hasChanges) {
                await saveData();
            }
        }

        // 自動偵測過夜換日刷新 & 背景離開時自動鎖上管理鎖及儲存備註
        document.addEventListener("visibilitychange", async () => {
            if (document.visibilityState === "hidden") {
                await flushPendingNoteSave();
            } else if (document.visibilityState === "visible") {
                const today = getTodayString();
                const dateEl = document.getElementById('today-date-text');
                const renderedDate = dateEl ? dateEl.dataset.currentDate : null;
                if (renderedDate && renderedDate !== today) {
                    const now = new Date();
                    displayCalYear = now.getFullYear();
                    displayCalMonth = now.getMonth();
                    await purgeOldRecords();
                    renderTodayView();
                    renderHistoryView();
                }
            }
        });

        async function saveData() {
            try {
                await Promise.all([
                    localforage.setItem('mom_medications', medications),
                    localforage.setItem('mom_dailyLogs', dailyLogs),
                    localforage.setItem('mom_dailyNotes', dailyNotes)
                ]);
            } catch (err) {
                console.warn('儲存資料至本地空間失敗:', err);
                showToast("手機儲存空間不足，請清理空間或匯出備份！", "error");
            }
        }

        // 強制立即寫入尚未儲存的備註（防止打卡或換頁時食字）
        async function flushPendingNoteSave() {
            if (noteSaveTimer) {
                clearTimeout(noteSaveTimer);
                noteSaveTimer = null;
            }
            if (activeNoteEdit) {
                const { dateStr, value } = activeNoteEdit;
                activeNoteEdit = null;
                await saveNote(dateStr, value, true);
            }
        }

        // 儲存備註
        async function saveNote(dateStr, content, skipTodayInputSync = false) {
            const trimmed = (content || '').trim();
            const existing = dailyNotes[dateStr] || '';
            if (trimmed === existing) return;

            if (!trimmed) {
                delete dailyNotes[dateStr];
            } else {
                dailyNotes[dateStr] = trimmed;
            }
            await saveData();
            
            if (!skipTodayInputSync && dateStr === getTodayString()) {
                const todayInput = document.getElementById('today-note-input');
                if (todayInput && todayInput !== document.activeElement && todayInput.value !== trimmed) {
                    todayInput.value = trimmed;
                }
            }
            renderHistoryView(); 
        }

        function scheduleNoteSave(dateStr, content) {
            activeNoteEdit = { dateStr, value: content };
            if (noteSaveTimer) clearTimeout(noteSaveTimer);
            noteSaveTimer = setTimeout(async () => {
                noteSaveTimer = null;
                activeNoteEdit = null;
                await saveNote(dateStr, content);
            }, 400);
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');
            if (!toast || !toastMsg || !toastIcon) return;
            
            if (toastTimeout) clearTimeout(toastTimeout);

            toastMsg.innerText = message;
            if (type === 'success') toastIcon.innerHTML = '<i class="fa-solid fa-circle-check text-green-400"></i>';
            else if (type === 'warning') toastIcon.innerHTML = '<i class="fa-solid fa-lock text-amber-400"></i>';
            else toastIcon.innerHTML = '<i class="fa-solid fa-circle-exclamation text-red-400"></i>';

            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 3000);
        }

        async function switchTab(tabName) {
            await flushPendingNoteSave();

            // 離開「藥物管理」頁時，自動重新上鎖，防止媽媽之後誤觸
            if (tabName !== 'manage' && isManageUnlocked) {
                isManageUnlocked = false;
            }

            ['today', 'history', 'manage'].forEach(tab => {
                document.getElementById(`view-${tab}`).classList.add('hidden');
                const tabBtn = document.getElementById(`tab-${tab}`);
                tabBtn.classList.remove('text-[#966b2e]');
                tabBtn.classList.add('text-[#b88b4a]/70');
            });

            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            const activeTabBtn = document.getElementById(`tab-${tabName}`);
            activeTabBtn.classList.remove('text-[#b88b4a]/70');
            activeTabBtn.classList.add('text-[#966b2e]');

            if (tabName === 'today') renderTodayView();
            if (tabName === 'history') renderHistoryView();
            if (tabName === 'manage') renderManageView();
        }

        // ================= 繪製示範藥物 SVG 圖片（供快速體驗測試） =================
        function createDemoPillDataUrl(bgColor, pillColor, labelText) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
                <rect width="320" height="320" rx="40" fill="${bgColor}"/>
                <rect x="65" y="110" width="190" height="100" rx="50" fill="${pillColor}" stroke="#5c3d14" stroke-width="6"/>
                <line x1="160" y1="110" x2="160" y2="210" stroke="#5c3d14" stroke-width="5" stroke-dasharray="8,6"/>
                <text x="160" y="275" font-size="28" font-family="sans-serif" font-weight="bold" fill="#3b260a" text-anchor="middle">${labelText}</text>
            </svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        async function loadDemoMedications() {
            medications = [
                {
                    id: 'demo_med_1',
                    name: '降血壓丸 (Amlodipine)',
                    slots: ['morning'],
                    dosage: '每日一次，朝早飯後食 1 粒（白色圓形）',
                    purpose: '控制血壓穩定',
                    sideEffects: '食完起身唔好太急，如果有頭暈或者腳腫請話俾屋企人知。',
                    images: [createDemoPillDataUrl('#fef3c7', '#ffffff', '白色圓形・朝早1粒')]
                },
                {
                    id: 'demo_med_2',
                    name: '胃藥及維他命 B 雜',
                    slots: ['morning', 'noon', 'evening'],
                    dosage: '每日三次，早、午、晚飯後各食 1 粒',
                    purpose: '保護胃部、補充營養',
                    sideEffects: '飯後溫水送服。',
                    images: [createDemoPillDataUrl('#dcfce7', '#86efac', '綠色膠囊・早午晚1粒')]
                },
                {
                    id: 'demo_med_3',
                    name: '膽固醇藥 (Atorvastatin)',
                    slots: ['bedtime'],
                    dosage: '每晚睡前食 1 粒',
                    purpose: '降低膽固醇',
                    sideEffects: '避免飲西柚汁；如果覺得肌肉酸痛請記低喺今日備註。',
                    images: [createDemoPillDataUrl('#fce7f3', '#fbcfe8', '粉紅橢圓・睡前1粒')]
                }
            ];
            await saveData();
            renderTodayView();
            renderHistoryView();
            renderManageView();
            showToast("已載入 3 款示範藥物！");
        }

        // ================= 今日打卡視圖渲染 =================
        function renderTodayView() {
            const container = document.getElementById('todayList');
            // 保留目前輸入框內的文字（如正在編輯）
            const existingInput = document.getElementById('today-note-input');
            const today = getTodayString();
            const currentDraftNote = existingInput ? existingInput.value : (dailyNotes[today] || '');

            container.innerHTML = '';
            
            const dateTextEl = document.getElementById('today-date-text');
            dateTextEl.innerText = getDisplayDate();
            dateTextEl.dataset.currentDate = today; 
            
            let totalSlotsCount = 0;
            let completedSlotsCount = 0;

            if (medications.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = "flex flex-col items-center justify-center min-h-[46vh] bg-[#fffdf9] rounded-[2rem] border-2 border-[#e6cca0] p-6 text-center shadow-sm mb-6";
                emptyState.innerHTML = `
                    <i class="fa-solid fa-pills text-6xl mb-4 text-[#b88b4a]"></i>
                    <p class="font-black text-2xl text-[#5c3d14] mb-2">尚未新增任何藥物</p>
                    <p class="font-bold text-lg text-[#78521f] mb-6">請撳右下角「藥物管理」解鎖後新增，或者載入示範藥物體驗效果</p>

        // ================= 智能收納：注意事項彈出視窗 =================

        // ================= 月曆切換功能與按鈕智能隱藏 =================
        function updateCalendarButtons() {
            const now = new Date();
            const currentY = now.getFullYear();
            const currentM = now.getMonth();

            const nextBtn = document.getElementById('cal-next-btn');
            if (displayCalYear > currentY || (displayCalYear === currentY && displayCalMonth >= currentM)) {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }

            const prevBtn = document.getElementById('cal-prev-btn');
            const todayStr = getTodayString();
            let oldestDateStr = todayStr;
            const validLogDates = Object.keys(dailyLogs).filter(d => {
                const { takenSlots } = getDayProgressStats(d);
                return takenSlots > 0;
            });
            const validNoteDates = Object.keys(dailyNotes).filter(d => dailyNotes[d] && dailyNotes[d].trim());
            const allSavedDates = [...validLogDates, ...validNoteDates].sort();
            
            if (allSavedDates.length > 0 && allSavedDates[0] < oldestDateStr) {
                oldestDateStr = allSavedDates[0];
            }
            
            const [oldY, oldM] = oldestDateStr.split('-').map(Number);
            if (displayCalYear < oldY || (displayCalYear === oldY && displayCalMonth <= oldM - 1)) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }
        }

        function changeCalendarMonth(offset) {
            displayCalMonth += offset;
            if (displayCalMonth < 0) {
                displayCalMonth = 11;
                displayCalYear--;
            } else if (displayCalMonth > 11) {
                displayCalMonth = 0;
                displayCalYear++;
            }
            renderHistoryView();
        }

        function renderHistoryView() {
            const container = document.getElementById('calendar-grid');
            const monthYearText = document.getElementById('calendar-month-year');
            const todayStr = getTodayString();

            monthYearText.innerText = `${displayCalYear}年 ${displayCalMonth + 1}月`;
            updateCalendarButtons();

            const firstDay = new Date(displayCalYear, displayCalMonth, 1).getDay(); 
            const daysInMonth = new Date(displayCalYear, displayCalMonth + 1, 0).getDate();

            let html = '';
            const daysOfWeek = ['日', '一', '二', '三', '四', '五', '六'];
            daysOfWeek.forEach(d => {
                html += `<div class="text-center text-base font-black text-[#78521f] mb-2">${d}</div>`;
            });

            for (let i = 0; i < firstDay; i++) {
                html += `<div></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${displayCalYear}-${String(displayCalMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const { takenSlots, totalSlots } = getDayProgressStats(dateStr);

                let bgClass = "bg-[#fbf3e4]/60 border-[#e6cca0] text-[#b88b4a]";
                const isPastOrToday = (dateStr <= todayStr);
                const hasNote = Boolean(dailyNotes[dateStr] && dailyNotes[dateStr].trim());
                
                let clickAction = '';
                let cursorClass = '';
                
                const noteIcon = hasNote ? `<div class="absolute -top-1 -right-1 text-amber-600 text-xs md:text-sm drop-shadow-sm"><i class="fa-solid fa-comment-dots"></i></div>` : '';

                if (isPastOrToday) {
                    clickAction = `onclick="openHistoryDetail('${dateStr}')"`;
                    cursorClass = "cursor-pointer active:scale-95 shadow-sm hover:border-[#966b2e]";
                    
                    if (totalSlots === 0 || takenSlots === 0) {
                        bgClass = "bg-[#fbf3e4] border-[#e6cca0] text-[#78521f] font-bold";
                    } else if (takenSlots < totalSlots) {
                        bgClass = "bg-amber-100 border-amber-400 text-amber-900 font-black";
                    } else {
                        bgClass = "bg-green-100 border-green-500 text-green-900 font-black";
                    }
                }

                const isToday = (dateStr === todayStr);
                const ringClass = isToday ? "ring-4 ring-[#966b2e] ring-offset-2 ring-offset-[#fffdf9]" : "";

                html += `
                    <div class="relative aspect-square rounded-2xl border-2 flex items-center justify-center ${bgClass} ${ringClass} ${cursorClass} transition-all" ${clickAction}>
                        <span class="text-xl md:text-2xl">${i}</span>
                        ${noteIcon}
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // ================= 歷史紀錄詳情視窗（同卡多時段補打卡／取消） =================

            const [y, m, d] = dateStr.split('-');

            noteInput.oninput = () => scheduleNoteSave(dateStr, noteInput.value);
            noteInput.onblur = async () => {
                if (noteSaveTimer) {
                    clearTimeout(noteSaveTimer);

                activeNoteEdit = null;

            const content = document.getElementById('history-detail-content');

        // ====== 智慧型動態確認視窗系統 ======
        function showConfirmModal(type, title, message, btnText, onConfirm, cancelText = "返回保留") {
            const modal = document.getElementById('modal-confirm');
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            
            const btn = document.getElementById('confirm-action-btn');
            btn.innerText = btnText;

            const cancelBtn = document.getElementById('confirm-cancel-btn');
            if (cancelBtn) cancelBtn.innerText = cancelText;
            
            const iconContainer = document.getElementById('confirm-icon-container');
            
            if (type === 'success') {
                btn.className = "w-full text-white py-4 rounded-2xl font-black text-2xl shadow-lg active:opacity-80 transition-colors bg-green-600";
                iconContainer.className = "w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-5 text-5xl";
                iconContainer.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else if (type === 'danger') {
                btn.className = "w-full text-white py-4 rounded-2xl font-black text-2xl shadow-lg active:opacity-80 transition-colors bg-red-600";
                iconContainer.className = "w-24 h-24 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-5 text-5xl";
                iconContainer.innerHTML = '<i class="fa-solid fa-trash"></i>';
            } else {
                btn.className = "w-full text-white py-4 rounded-2xl font-black text-2xl shadow-lg active:opacity-80 transition-colors bg-amber-600";
                iconContainer.className = "w-24 h-24 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-5 text-5xl";
                iconContainer.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            confirmActionCallback = onConfirm;
            btn.onclick = () => {
                const cb = confirmActionCallback;
                closeConfirmModal();
                if (cb) cb();
            };
            modal.classList.replace('hidden', 'flex');
        }

        function closeConfirmModal() {
            confirmActionCallback = null;
            document.getElementById('modal-confirm').classList.replace('flex', 'hidden');
        }

        // ====== 核心多時段打卡功能（防連擊、防誤觸跨時段、防備註食字） ======
        async function toggleMedicationSlot(id, slotKey, currentState, targetDate) {
            // 防手震連撳兩下（350ms 內忽略重複點擊）
            const nowTs = Date.now();
            if (nowTs - lastToggleTimestamp < 350) return;
            lastToggleTimestamp = nowTs;

            // 先強制儲存正在輸入的備註，避免重繪洗走文字
            await flushPendingNoteSave();

            const isToday = (targetDate === getTodayString());
            const med = medications.find(m => m.id === id);
            const slotDef = SLOT_DEFINITIONS.find(s => s.key === slotKey) || { key: slotKey, label: '服藥' };

            const applySlotToggle = async (newState) => {
                if (!dailyLogs[targetDate] || typeof dailyLogs[targetDate] !== 'object') {
                    dailyLogs[targetDate] = {};
                }
                // 確保該藥物的紀錄為物件格式
                if (dailyLogs[targetDate][id] === true) {
                    const existingSlots = med ? getMedSlots(med) : ['morning'];
                    const converted = {};
                    existingSlots.forEach(s => { converted[s] = true; });
                    dailyLogs[targetDate][id] = converted;
                } else if (!dailyLogs[targetDate][id] || typeof dailyLogs[targetDate][id] !== 'object') {
                    dailyLogs[targetDate][id] = {};
                }

                if (newState) {
                    dailyLogs[targetDate][id][slotKey] = true;
                } else {
                    delete dailyLogs[targetDate][id][slotKey];
                }

                updateDaySnapshotMeta(targetDate);
                await saveData();

                if (isToday) renderTodayView();
                renderHistoryView();
                if (!document.getElementById('modal-history-detail').classList.contains('hidden')) {
                    openHistoryDetail(targetDate);
                }
            };

            if (currentState) {
                // 取消打卡：彈出確認視窗防止誤觸
                showConfirmModal(
                    "warning",
                    `取消「${slotDef.label}」打卡？`,
                    `將取消「${med ? med.name : ''}」嘅【${slotDef.label}】已食紀錄。`,
                    "確定取消",
                    async () => {
                        await applySlotToggle(false);
                    }
                );
            } else {
                if (!isToday) {
                    // 過去日期補打卡：彈出綠色確認視窗
                    showConfirmModal(
                        "success",
                        `補回「${slotDef.label}」紀錄？`,

            const temp = medications[index];
            medications[index] = medications[targetIndex];

        // ====== 手機觸控與滑鼠拖曳排序（只限按住 .drag-handle 觸發，不干擾正常頁面滑動） ======
        function initTouchAndMouseDragSort() {
            const container = document.getElementById('manageList');
            const handles = container.querySelectorAll('.drag-handle');

            handles.forEach(handle => {
                handle.onpointerdown = function(e) {
                    if (!isManageUnlocked) return;
                    e.preventDefault();
                    const card = handle.closest('.manage-med-card');
                    if (!card) return;

                    handle.setPointerCapture(e.pointerId);
                    const startIndex = parseInt(card.dataset.index, 10);
                    let targetIndex = startIndex;

                    card.classList.add('dragging-card');
                    if (navigator.vibrate) navigator.vibrate(40);

                    const onPointerMove = (moveEvent) => {
                        const clientY = moveEvent.clientY;
                        const allCards = Array.from(container.querySelectorAll('.manage-med-card'));
                        allCards.forEach(c => c.classList.remove('drag-over-target'));

                        for (let i = 0; i < allCards.length; i++) {
                            const c = allCards[i];
                            if (c === card) continue;
                            const rect = c.getBoundingClientRect();
                            const midY = rect.top + rect.height / 2;
                            if (clientY >= rect.top && clientY <= rect.bottom) {
                                c.classList.add('drag-over-target');
                                targetIndex = (clientY < midY) ? i : i;
                                break;
                            }
                        }
                    };

                    const onPointerUp = async () => {
                        handle.removeEventListener('pointermove', onPointerMove);
                        handle.removeEventListener('pointerup', onPointerUp);
                        handle.removeEventListener('pointercancel', onPointerUp);

                        card.classList.remove('dragging-card');
                        container.querySelectorAll('.manage-med-card').forEach(c => c.classList.remove('drag-over-target'));

                        if (targetIndex !== startIndex && targetIndex >= 0 && targetIndex < medications.length) {
                            const [movedItem] = medications.splice(startIndex, 1);
                            medications.splice(targetIndex, 0, movedItem);
                            await saveData();
                            renderManageView();
                            renderTodayView();
                            showToast("已更新藥物次序！");
                        }
                    };

                    handle.addEventListener('pointermove', onPointerMove);
                    handle.addEventListener('pointerup', onPointerUp);
                    handle.addEventListener('pointercancel', onPointerUp);
                };
            });
        }

        // ====== 完美備份與防誤觸匯入 ======
        async function exportData() {
            await flushPendingNoteSave();
            const hasLogs = Object.keys(dailyLogs).length > 0;
            const hasNotes = Object.keys(dailyNotes).length > 0;
            if (medications.length === 0 && !hasLogs && !hasNotes) {
                return showToast("目前沒有資料可匯出", "error");
            }
            
            const dataStr = JSON.stringify({ medications, dailyLogs, dailyNotes }, null, 2);
            const fileName = `mom_pills_backup_${getTodayString()}.json`;
            
            if (navigator.canShare && typeof File === 'function') {
                try {
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const file = new File([blob], fileName, { type: 'application/json' });
                    
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file] });
                        return showToast("備份已導出！");
                    }
                } catch (err) {
                    if (err && err.name === 'AbortError') return;
                }
            }

            const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast("備份已下載！");
        }

        function importData(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data.medications) || !data.dailyLogs || typeof data.dailyLogs !== 'object') {
                        return showToast("備份檔案格式不正確", "error");
                    }
                    // 驗證每項藥物結構完整
                    const validMeds = data.medications.filter(m => m && typeof m === 'object' && typeof m.name === 'string' && m.name.trim() !== '');

                    showConfirmModal(
                        "warning",
                        "確定匯入備份資料？",
                        `將會載入備份內嘅 ${validMeds.length} 款藥物及打卡紀錄，並覆蓋目前手機上嘅資料。`,
                        "確定匯入覆蓋",
                        async () => {
                            medications = validMeds;
                            dailyLogs = data.dailyLogs;
                            dailyNotes = (data.dailyNotes && typeof data.dailyNotes === 'object') ? data.dailyNotes : {};
                            normalizeAllData();
                            await purgeOldRecords();
                            await saveData();
                            const now = new Date();
                            displayCalYear = now.getFullYear();
                            displayCalMonth = now.getMonth();
                            renderManageView();
                            renderTodayView();
                            renderHistoryView();
                            showToast("資料匯入成功！");
                        },
                        "取消匯入"
                    );
                } catch (err) {
                    showToast("讀取備份檔案失敗", "error");
                }
            };
            reader.readAsText(file);
        }

        // ================= 圖片處理與限制 (加大預覽，最高 8 張) =================
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (currentEditingImages.length >= 8) {
                event.target.value = '';
                return showToast("最多可上傳 8 張相片！", "error");
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 900;
                    if (width > height && width > maxDim) {
                        height = Math.round(height * (maxDim / width));
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round(width * (maxDim / height));
                        height = maxDim;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    currentEditingImages.push(canvas.toDataURL('image/jpeg', 0.75));
                    canvas.width = 0;
                    canvas.height = 0;
                    renderImagePreviews();
                };
                img.onerror = function() {
                    showToast("相片載入失敗", "error");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        async function saveMedication() {
            const id = document.getElementById('medId').value;
            const name = document.getElementById('medName').value.trim();
            if (!name) return showToast("請輸入藥物名稱！", "error");
            if (currentEditingSlots.length === 0) {
                return showToast("請至少揀選一個服藥時段（早／午／晚／睡前）！", "error");
            }

            const orderedSlots = VALID_SLOT_KEYS.filter(k => currentEditingSlots.includes(k));
            const uniqueId = id || `med_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;

            const medData = { 
                id: uniqueId, 
                name, 
                slots: orderedSlots,
                dosage: document.getElementById('medDosage').value.trim(),
                purpose: document.getElementById('medPurpose').value.trim(), 
                sideEffects: document.getElementById('medSideEffects').value.trim(), 
                images: [...currentEditingImages] 
            };
            
            if (id) {
                const idx = medications.findIndex(m => m.id === id);
                if (idx !== -1) medications[idx] = medData;
                else medications.push(medData);
            } else {
                medications.push(medData);
            }

            // 清理今日該藥已不再屬於設定時段的多餘打卡
            const today = getTodayString();
            if (dailyLogs[today] && dailyLogs[today][uniqueId] && typeof dailyLogs[today][uniqueId] === 'object') {
                for (const sKey of Object.keys(dailyLogs[today][uniqueId])) {
                    if (!orderedSlots.includes(sKey)) {
                        delete dailyLogs[today][uniqueId][sKey];
                    }
                }
                updateDaySnapshotMeta(today);
            }

            await saveData();
            closeAddModal();
            renderManageView();
            renderTodayView();
            renderHistoryView();
            showToast("藥物資料已儲存！");
        }

        function confirmDeleteMedication(id) {
            if (!isManageUnlocked) {
                return showToast("請先解鎖管理模式", "warning");
            }
            const med = medications.find(m => m.id === id);
            showConfirmModal(
                "danger",
                "確定刪除藥物？",
                `確定要從清單中移除「${med ? med.name : '這項藥物'}」嗎？`,
                "確定刪除",
                async () => {
                    medications = medications.filter(m => m.id !== id);
                    // 只清理今日未完成的該藥紀錄，保留過去歷史日期的完成快照
                    const today = getTodayString();
                    if (dailyLogs[today] && id in dailyLogs[today]) {
                        delete dailyLogs[today][id];
                        updateDaySnapshotMeta(today);
                    }
                    await saveData();
                    renderManageView();
                    renderTodayView();
                    renderHistoryView();
                    showToast("已刪除藥物。");
                }
            );
        }

        // ================= 加大相片檢視器（支援撳相 2x 放大檢視細節） =================
        function toggleViewerImageZoom(imgEl) {
            const isZoomed = imgEl.dataset.zoomed === 'true';
            if (isZoomed) {
                imgEl.dataset.zoomed = 'false';
                imgEl.className = "w-full bg-white rounded-2xl p-2 object-contain max-h-[72vh] transition-transform duration-200 cursor-zoom-in";
            } else {
                imgEl.dataset.zoomed = 'true';
                imgEl.className = "w-full bg-white rounded-2xl p-2 object-contain max-h-none scale-125 my-8 transition-transform duration-200 cursor-zoom-out";
            }
        }

        function openImageViewer(id) {
            const med = medications.find(m => m.id === id);
            if (!med || !med.images?.length) return;
            const container = document.getElementById('viewer-img-container');
            const safeName = escapeHtml(med.name);
            const safeDosage = escapeHtml(med.dosage);
            let html = `
                <div class="text-center w-full px-4 mt-2 shrink-0">
                    <h3 class="text-[#fffdf9] text-3xl sm:text-4xl font-black mb-1">${safeName}</h3>
                    ${safeDosage ? `<p class="text-[#f3e2c5] text-xl font-bold">${safeDosage}</p>` : ''}
                </div>
            `;
            med.images.forEach((src, i) => {
                html += `
                    <div class="w-full max-w-2xl bg-[#3b260a] p-4 rounded-3xl shadow-2xl border-2 border-[#966b2e] shrink-0 overflow-hidden">
                        <div class="text-[#f3e2c5] text-lg font-black mb-3 text-center bg-[#261705] rounded-full py-1.5 w-max px-6 mx-auto border border-[#78521f]">相片 ${i + 1} / ${med.images.length}</div>
                        <img src="${src}" onclick="toggleViewerImageZoom(this)" data-zoomed="false" alt="${safeName} 相片 ${i + 1}" class="w-full bg-white rounded-2xl p-2 object-contain max-h-[72vh] transition-transform duration-200 cursor-zoom-in">
                    </div>`;
            });
            container.innerHTML = html;
            document.getElementById('modal-image-viewer').classList.replace('hidden', 'flex');
        }

        function closeImageViewer() {
            document.getElementById('modal-image-viewer').classList.replace('flex', 'hidden');
        }

        window.onload = initApp;
    </script>
</body>
</html>
